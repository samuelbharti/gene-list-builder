# Brand configuration: the app's colors, fonts, and logo in one place.
# Consumed automatically by bslib via `bs_theme(brand = TRUE)` (see ui.R).
# Spec: https://posit-dev.github.io/brand-yml/
#
# "Bone & Bronze": a warm, low-chroma light theme. Warm near-black text on a
# bone-coloured ground, near-white cards for hierarchy, and a single muted
# bronze accent used only on interactive elements (buttons/links). Organic by
# material rather than by hue, so it avoids the sage-and-terracotta cliche.
#
# Every palette entry below is exposed to Sass as `$brand-<name>` (e.g.
# `$brand-canvas`), and ui.R's Sass references those variables rather than
# repeating hex codes. This file is the single source of truth for colour:
# do not hard-code hexes in ui.R.

meta:
  name: Gene List Builder

color:
  palette:
    canvas: "#F2EFE8" # warm bone ground (body background)
    card: "#FDFCFA" # near-white raised surface
    border: "#E4DFD4" # the one hairline border token
    ink: "#26221C" # warm near-black (text)
    muted: "#736C60" # secondary text
    bronze: "#8A6A3C" # the single accent
    green: "#5E7150" # muted success
    amber: "#C07A2C" # muted warning, pushed toward orange so it stays
    # distinguishable from the bronze accent
    red: "#B2503F" # muted danger
  foreground: ink
  background: canvas
  primary: bronze
  secondary: muted
  success: green
  info: bronze
  warning: amber
  danger: red

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
  base:
    family: Inter
    size: 16px
  headings:
    family: Inter
    weight: 600
