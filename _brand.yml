# Brand configuration: the app's colors, fonts, and logo in one place.
# Consumed automatically by bslib via `bs_theme(brand = TRUE)` (see ui.R).
# Spec: https://posit-dev.github.io/brand-yml/
#
# "Ink & Rust": a warm, tinted light theme built on two rules.
#
#   1. No white anywhere. The ground is a warm greige and every raised surface
#      (cards, navbar, inputs, tables, popovers) is a sand tint. Bootstrap
#      defaults several of these to #FFF, so ui.R overrides them explicitly.
#   2. Not one hue family. A cool indigo-slate primary sits against a warm rust
#      secondary, with ochre for highlights. The cool/warm split is what keeps
#      the page from reading as a single wash of colour.
#
# Every palette entry is exposed to Sass as `$brand-<name>` (e.g. `$brand-card`),
# and ui.R references those variables rather than repeating hex codes. This file
# is the single source of truth for colour: do not hard-code hexes in ui.R.

meta:
  name: Gene List Builder

color:
  palette:
    canvas: "#E8E3DA" # warm greige ground (body background)
    card: "#F4EFE6" # sand-tinted raised surface, deliberately not white
    border: "#D6CEC0" # the one hairline border token
    ink: "#23262E" # cool near-black (text), reads against the warm ground
    muted: "#6B6559" # secondary text
    indigo: "#3D4A63" # cool primary accent
    rust: "#A85A3C" # warm secondary accent, unlike the primary on purpose
    ochre: "#C08B2E" # warm highlight / warning
    sage: "#5F7A5B" # muted success
    brick: "#9E3F33" # muted danger
  foreground: ink
  background: canvas
  primary: indigo
  secondary: rust
  success: sage
  info: indigo
  warning: ochre
  danger: brick

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
  base:
    family: Inter
    size: 16px
  headings:
    family: Inter
    weight: 600
