# Pre-commit hooks for the Gene List Builder Shiny app.
# Setup:  pip install prek  &&  prek install
# Run on everything:  prek run --all-files
# Docs: https://github.com/j178/prek (drop-in prek runner for this same config)

# Generated/vendored paths that hooks should never touch. renv.lock and
# manifest.json are generated and full of third-party package names and author
# surnames (codespell reads "deSolve" as a typo and "Hass" as "Hash"), so they
# are excluded rather than annotated.
exclude: "^(renv/|renv\\.lock$|manifest\\.json$|data/|docs/)"

repos:
  # Block secrets (API keys, tokens) from ever entering a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # R code formatting with air (matches air.toml; same formatter rstudio/shiny uses).
  # The hook lives in air-pre-commit, not the air repo; tags have no "v" prefix.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.9.0
    hooks:
      - id: air-format

  # R-specific safety checks (formatting is handled by air above).
  # Dev tag: the v0.4.3 release pins digest 0.6.36, which fails to compile on R 4.6.
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9032
    hooks:
      - id: parsable-R
      - id: no-browser-statement
      - id: no-debug-statement
      - id: no-print-statement
        exclude: "^dev/"

  # Generic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-yaml
      - id: check-merge-conflict

  # Catch common spelling mistakes in code and docs.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      # "ot"/"OT" is the Open Targets abbreviation used throughout, not a typo.
      # "socio-economic" is Contributor Covenant wording in CODE_OF_CONDUCT.md.
      - id: codespell
        args: ["--ignore-words-list=ans,fo,ot,unparseable,socio-economic"]
